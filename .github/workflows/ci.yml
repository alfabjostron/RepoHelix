name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (build, test, fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
