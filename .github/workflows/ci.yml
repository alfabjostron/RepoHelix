name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (build, test, fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --all

      - name: Smoke-test the fixture demo
        run: |
          cargo run --release -- analyze --log fixtures/nebula.gitlog --format json --compact > /tmp/report.json
          test -s /tmp/report.json
          grep -q 'repohelix/analysis/v1' /tmp/report.json
          cargo run --release -- viewer-data --log fixtures/nebula.gitlog --out /tmp/viewer.json
          grep -q 'repohelix/viewer/v1' /tmp/viewer.json

  viewer:
    name: TypeScript viewer (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and build
        run: npm run build

      - name: Run core tests
        run: npm test

