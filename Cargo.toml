[package]
name = "repohelix"
version = "0.1.0"
edition = "2021"
description = "Git history architecture and temporal-coupling explorer built on the Rust standard library"
license = "MIT"
authors = ["RepoHelix contributors"]
repository = "https://github.com/alfabjostron/RepoHelix"
readme = "README.md"
keywords = ["git", "history", "temporal-coupling", "churn", "analysis"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "repohelix"
path = "src/main.rs"

[lib]
name = "repohelix"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
# Intentionally empty: repohelix depends only on the Rust standard library.

