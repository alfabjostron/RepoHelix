    <title>repohelix — history viewer</title>

      :root {
        color-scheme: dark;
        --bg: #0b1413;

      * { box-sizing: border-box; }

      }

        border-bottom: 1px solid var(--line);

        font-size: 20px;
        letter-spacing: 0.5px;
