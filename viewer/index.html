<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>repohelix — history viewer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1413;
        --panel: #10201e;
        --ink: #cfe8e6;
        --muted: #7fa8a3;
        --line: #1d3330;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(1200px 800px at 70% -10%, #12302c 0%, var(--bg) 60%);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      header {
        padding: 20px 28px 8px;
        border-bottom: 1px solid var(--line);
      }
