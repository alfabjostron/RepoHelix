<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace" role="img"
     aria-label="repohelix co-change atlas: files arranged on a ring with chords whose weight encodes temporal-coupling strength">
  <title>repohelix: co-change atlas (nebula fixture)</title>
  <desc>Files on a ring; each chord links two files that changed together in the
        synthetic nebula history. Heavier, straighter chords mean stronger
        temporal coupling. Strength is a Jaccard-style ratio of shared commits.</desc>
  <defs>
    <radialGradient id="atlasbg" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#123430"/>
      <stop offset="1" stop-color="#08100f"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#43c8bd" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#43c8bd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="520" fill="url(#atlasbg)"/>
  <text x="24" y="34" fill="#cfe8e6" font-size="17" font-weight="600">repohelix · co-change atlas</text>
  <text x="24" y="52" fill="#7fa8a3" font-size="11">temporal coupling: files that change in the same commit</text>

  <!-- Centre glow that breathes. -->
  <circle cx="320" cy="290" r="150" fill="url(#core)">
    <animate attributeName="r" values="130;165;130" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Guide ring. -->
  <circle cx="320" cy="290" r="170" fill="none" stroke="#1d3330" stroke-width="1.2" opacity="0.7"/>

  <!-- Chords. Ring layout (8 slots, starting at top, clockwise):
       0 handlers.rs (320,120)  1 router.rs (440,175)
       2 storage.rs (490,290)   3 config.rs (440,405)
       4 main.rs (320,460)      5 lib.rs (200,405)
       6 auth.rs (150,290)      7 Cargo.toml (200,175)
       Chord weight = 0.6 + 4*strength; opacity fades in staggered. -->
  <g fill="none">
    <!-- handlers.rs ↔ router.rs : strength 0.58 (strongest, straightest) -->
    <path d="M320,120 Q356,242 440,175" stroke="rgb(154,192,110)" stroke-width="3.0" opacity="0">
      <animate attributeName="opacity" values="0;0.72" dur="0.9s" begin="0.0s" fill="freeze"/>
      <animate attributeName="stroke-width" values="3.0;3.6;3.0" dur="4s" begin="1s" repeatCount="indefinite"/>
    </path>
    <!-- handlers.rs ↔ storage.rs : strength 0.31 -->
    <path d="M320,120 Q372,236 490,290" stroke="rgb(120,196,131)" stroke-width="1.85" opacity="0">
      <animate attributeName="opacity" values="0;0.52" dur="0.9s" begin="0.25s" fill="freeze"/>
    </path>
    <!-- main.rs ↔ router.rs : strength 0.27 -->
    <path d="M320,460 Q392,300 440,175" stroke="rgb(112,197,138)" stroke-width="1.7" opacity="0">
      <animate attributeName="opacity" values="0;0.48" dur="0.9s" begin="0.45s" fill="freeze"/>
    </path>
    <!-- Cargo.toml ↔ lib.rs : strength 0.38 -->
    <path d="M200,175 Q248,300 200,405" stroke="rgb(132,195,124)" stroke-width="2.1" opacity="0">
      <animate attributeName="opacity" values="0;0.57" dur="0.9s" begin="0.65s" fill="freeze"/>
    </path>
    <!-- Cargo.toml ↔ storage.rs : strength 0.22 -->
    <path d="M200,175 Q348,250 490,290" stroke="rgb(104,197,145)" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" values="0;0.43" dur="0.9s" begin="0.85s" fill="freeze"/>
    </path>
    <!-- lib.rs ↔ main.rs : strength 0.20 -->
    <path d="M200,405 Q280,392 320,460" stroke="rgb(100,198,148)" stroke-width="1.4" opacity="0">
      <animate attributeName="opacity" values="0;0.41" dur="0.9s" begin="1.05s" fill="freeze"/>
    </path>
