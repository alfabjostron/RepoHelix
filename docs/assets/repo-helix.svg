<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace" role="img"
     aria-label="repohelix helix: files threaded along a double-helix strand, radius encodes churn, colour encodes ownership concentration">
  <title>repohelix: repository helix (nebula fixture)</title>
  <desc>A double-helix strand of the nine busiest files from the synthetic nebula
        history. Node radius encodes churn; colour runs from teal (shared
        stewardship) to amber (single-owner / bus-factor risk). Metrics describe
        code activity, not people.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d211f"/>
      <stop offset="1" stop-color="#09100f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#43c8bd" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#43c8bd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="460" fill="url(#bg)"/>
  <ellipse cx="320" cy="230" rx="260" ry="180" fill="url(#glow)">
    <animate attributeName="rx" values="240;280;240" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <text x="24" y="34" fill="#cfe8e6" font-size="17" font-weight="600">repohelix · helix strand</text>
  <text x="24" y="52" fill="#7fa8a3" font-size="11">nebula fixture · 24 commits · 4 authors · 20-day span</text>

  <!-- Two backbone strands weaving in anti-phase. The dasharray march gives a
       flowing sense of transcription without any script. -->
  <g stroke-linecap="round" fill="none">
    <path d="M120,90 C260,150 380,150 520,90 C380,240 260,240 120,300 C260,360 380,360 520,300"
          stroke="#2b6f6a" stroke-width="3" opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" values="0;-160" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M520,90 C380,150 260,150 120,90 C260,240 380,240 520,300 C380,360 260,360 120,300"
          stroke="#8a6a34" stroke-width="3" opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" values="0;160" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Rungs connecting the strands. -->
  <g stroke="#1d3330" stroke-width="1.4" opacity="0.7">
    <line x1="120" y1="90"  x2="520" y2="90"/>
    <line x1="470" y1="130" x2="170" y2="130"/>
    <line x1="200" y1="180" x2="440" y2="180"/>
    <line x1="470" y1="230" x2="170" y2="230"/>
    <line x1="200" y1="280" x2="440" y2="280"/>
    <line x1="470" y1="330" x2="170" y2="330"/>
    <line x1="120" y1="300" x2="520" y2="300"/>
  </g>

  <!-- File nodes. Radius ~ sqrt(churn); colour ~ concentration.
       Values taken directly from the fixture analysis. -->
  <!-- handlers.rs churn 684 (busiest, shared) -->
