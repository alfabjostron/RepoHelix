<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace" role="img"
     aria-label="repohelix helix: files threaded along a double-helix strand, radius encodes churn, colour encodes ownership concentration">
  <title>repohelix: repository helix (nebula fixture)</title>
  <desc>A double-helix strand of the nine busiest files from the synthetic nebula
        history. Node radius encodes churn; colour runs from teal (shared
        stewardship) to amber (single-owner / bus-factor risk). Metrics describe
        code activity, not people.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d211f"/>
      <stop offset="1" stop-color="#09100f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#43c8bd" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#43c8bd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="460" fill="url(#bg)"/>
  <ellipse cx="320" cy="230" rx="260" ry="180" fill="url(#glow)">
    <animate attributeName="rx" values="240;280;240" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <text x="24" y="34" fill="#cfe8e6" font-size="17" font-weight="600">repohelix · helix strand</text>
  <text x="24" y="52" fill="#7fa8a3" font-size="11">nebula fixture · 24 commits · 4 authors · 20-day span</text>

